<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draft Assistant</title>
<style>
:root{
  --bg:#0e1116; --surface:#161a21; --surface-2:#1c212a; --raised:#222834;
  --line:#252c37; --line-soft:#1e242d;
  --text:#e8ecf2; --text-2:#9aa5b4; --text-3:#66707e;
  --accent:#4c8dff; --accent-soft:#4c8dff22;
  --good:#3fbf7f; --good-soft:#3fbf7f1f;
  --warn:#e0a33a; --warn-soft:#e0a33a1f;
  --bad:#e05a5a;  --bad-soft:#e05a5a1f;
  --qb:#a97bff; --rb:#3fbf7f; --wr:#43a9e8; --te:#e0a33a; --k:#6b7683; --def:#4fb3a8;
  --radius:10px;
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#f4f6f9; --surface:#ffffff; --surface-2:#f7f9fc; --raised:#eef2f7;
    --line:#dfe5ed; --line-soft:#e9eef4;
    --text:#131822; --text-2:#5a6675; --text-3:#8b96a5;
    --accent:#1f6feb; --accent-soft:#1f6feb14;
    --good:#1a8f5c; --good-soft:#1a8f5c14;
    --warn:#a86f10; --warn-soft:#a86f1014;
    --bad:#c53434;  --bad-soft:#c5343414;
    --qb:#7b4fd8; --rb:#1a8f5c; --wr:#1d7fb8; --te:#a86f10; --k:#6b7683; --def:#2f8b81;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-variant-numeric:tabular-nums; padding:16px; min-height:100vh;
}
.bar{
  display:flex; align-items:center; gap:16px; padding:12px 18px; margin-bottom:14px;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
}
.pick{font-size:19px;font-weight:600;letter-spacing:-.01em}
.sub{color:var(--text-2);font-size:13px}
.spacer{flex:1}
.badge{
  padding:5px 12px;border-radius:99px;font-size:12px;font-weight:600;
  letter-spacing:.02em;white-space:nowrap;transition:background .3s var(--ease),color .3s var(--ease);
}
.badge.clock{background:var(--good-soft);color:var(--good);animation:pulse 2s ease-in-out infinite}
.badge.wait{background:var(--warn-soft);color:var(--warn)}
.badge.idle{background:var(--raised);color:var(--text-2)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.dot{width:7px;height:7px;border-radius:50%;background:var(--good);display:inline-block;margin-right:6px;transition:background .3s}
.dot.off{background:var(--bad)}

.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
@media (max-width:1200px){.grid{grid-template-columns:1fr}}

.card{
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--radius); margin-bottom:14px; overflow:hidden;
}
.card h2{
  font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;
  color:var(--text-3);padding:13px 16px 0;
}

/* hero */
.hero{padding:16px 18px;border-bottom:1px solid var(--line-soft);display:flex;gap:18px;align-items:flex-start}
.hero .who{flex:1;min-width:0}
.hero .nm{font-size:24px;font-weight:650;letter-spacing:-.02em;line-height:1.15}
.hero .meta{color:var(--text-2);font-size:13px;margin-top:5px}
.hero .note{color:var(--warn);font-size:13px;margin-top:7px;min-height:19px}
.hero .score{text-align:right;flex-shrink:0}
.hero .val{font-size:30px;font-weight:650;letter-spacing:-.02em;line-height:1}
.hero .gap{color:var(--text-3);font-size:12px;margin-top:5px}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:14px 18px 16px}
.stat{background:var(--surface-2);border-radius:8px;padding:9px 11px}
.stat .l{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-3)}
.stat .v{font-size:17px;font-weight:600;margin-top:3px}

/* board */
table{width:100%;border-collapse:collapse}
thead th{
  font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;
  color:var(--text-3);text-align:right;padding:10px 10px;border-bottom:1px solid var(--line);
}
thead th.l{text-align:left}
tbody tr{border-bottom:1px solid var(--line-soft);will-change:transform}
tbody tr:last-child{border-bottom:none}
tbody tr.enter{animation:slidein .45s var(--ease)}
@keyframes slidein{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
tbody tr.top{background:var(--accent-soft)}
td{padding:9px 10px;text-align:right;font-size:13.5px}
td.l{text-align:left}
td.rank{color:var(--text-3);font-size:12px;width:30px}
.pname{font-weight:550}
.tag{
  display:inline-block;min-width:32px;text-align:center;padding:2px 6px;border-radius:5px;
  font-size:10.5px;font-weight:700;letter-spacing:.03em;margin-right:8px;
}
.sm{color:var(--text-3);font-size:12px;margin-left:7px}
.chip{padding:2px 7px;border-radius:5px;font-size:12px;font-weight:600}
.notes{color:var(--text-3);font-size:12px;text-align:left;max-width:230px}
.flash{animation:flash .8s var(--ease)}
@keyframes flash{0%{background:var(--accent-soft)}100%{background:transparent}}

/* bars */
.row{display:flex;align-items:center;gap:10px;padding:7px 16px}
.row .p{width:30px;font-size:12px;font-weight:650}
.track{flex:1;height:8px;background:var(--raised);border-radius:4px;overflow:hidden}
.fill{height:100%;border-radius:4px;width:0;transition:width .55s var(--ease),background .35s var(--ease)}
.row .n{width:34px;text-align:right;font-size:12.5px;color:var(--text-2)}
.row .best{width:0;flex:1.1;color:var(--text-3);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* roster */
.slot{display:flex;gap:10px;padding:5px 16px;font-size:13px;align-items:baseline}
.slot .s{width:38px;color:var(--text-3);font-size:11px;font-weight:650;letter-spacing:.04em;flex-shrink:0}
.slot .p{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pills{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px 14px}
.pill{padding:3px 9px;border-radius:6px;font-size:12px;font-weight:600;transition:background .3s var(--ease),color .3s var(--ease)}
.foot{padding:10px 16px 14px;color:var(--text-3);font-size:11.5px;line-height:1.7}
.empty{padding:26px 18px;text-align:center;color:var(--text-3);font-size:13px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="bar">
  <div>
    <div class="pick" id="pick">—</div>
    <div class="sub" id="sub">connecting…</div>
  </div>
  <div class="spacer"></div>
  <div class="badge idle" id="clock">waiting</div>
  <div class="sub"><span class="dot" id="dot"></span><span id="conn">live</span></div>
</div>

<div class="grid">
  <div>
    <div class="card">
      <div class="hero">
        <div class="who">
          <div class="nm" id="h-name">—</div>
          <div class="meta" id="h-meta"></div>
          <div class="note" id="h-note"></div>
        </div>
        <div class="score">
          <div class="val" id="h-sim">—</div>
          <div class="gap" id="h-gap"></div>
        </div>
      </div>
      <div class="stats" id="h-stats"></div>
    </div>
    <div class="card">
      <table>
        <thead><tr>
          <th class="l" style="width:30px"></th><th class="l">Player</th>
          <th>ADP</th><th>Proj</th><th>VOR</th><th>Val</th><th>Up</th><th>Back</th><th>Sim</th>
          <th class="l" style="padding-left:16px">Notes</th>
        </tr></thead>
        <tbody id="board"></tbody>
      </table>
      <div class="empty" id="board-empty" style="display:none">waiting for the draft to start</div>
    </div>
  </div>

  <div>
    <div class="card">
      <h2>Cost of waiting</h2>
      <div id="waiting" style="padding:8px 0 12px"></div>
    </div>
    <div class="card">
      <h2>Your roster <span id="r-count" style="color:var(--text-3)"></span></h2>
      <div id="lineup" style="padding:10px 0 4px"></div>
      <div class="pills" id="depth"></div>
      <div class="foot" id="r-foot"></div>
    </div>
    <div class="card">
      <h2>Recent picks</h2>
      <div class="foot" id="recent"></div>
    </div>
  </div>
</div>

<script>
const POS = {QB:'--qb',RB:'--rb',WR:'--wr',TE:'--te',K:'--k',DEF:'--def'};
const $ = id => document.getElementById(id);
const rows = new Map(), bars = new Map(), slots = new Map(), pills = new Map();
let prevSim = null, fails = 0;

const posColor = p => `var(${POS[p] || '--k'})`;
const survColor = s => s >= .7 ? 'var(--good)' : s >= .35 ? 'var(--warn)' : 'var(--bad)';
const costColor = c => c >= 15 ? 'var(--bad)' : c >= 6 ? 'var(--warn)' : 'var(--good)';

/* Every DOM write goes through these. Assigning innerHTML or textContent on
   each poll re-creates nodes even when the value is identical, which is what
   made the board flicker once a second. Writing only on change removes it. */
function setText(el, v){ const s = String(v); if (el.textContent !== s) el.textContent = s; }
function setStyle(el, prop, v){ if (el.style[prop] !== v) el.style[prop] = v; }
function setClass(el, cls, on){ if (el.classList.contains(cls) !== !!on) el.classList.toggle(cls, !!on); }

/* Put `node` at `index` inside `host`, but ONLY if it is not already there.
   appendChild() on an attached node detaches and re-inserts it, which restarts
   any CSS animation on that node -- calling it every poll is what made rows
   replay their entrance animation twice a second. */
function place(host, node, index){
  const at = host.children[index];
  if (at !== node) host.insertBefore(node, at || null);
}

/* Play a one-shot animation class and clean it up, so it can never re-fire
   later just because the node moved. */
function playOnce(el, cls){
  el.classList.remove(cls);
  void el.offsetWidth;
  el.classList.add(cls);
  el.addEventListener('animationend', () => el.classList.remove(cls), {once: true});
}

function tween(el, to, dur = 550){
  const from = prevSim === null ? to : prevSim;
  if (from === to){ setText(el, to.toFixed(0)); return; }
  const t0 = performance.now();
  const step = now => {
    const k = Math.min(1, (now - t0) / dur);
    const e = 1 - Math.pow(1 - k, 3);
    setText(el, (from + (to - from) * e).toFixed(0));
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function makeTag(p){
  const s = document.createElement('span');
  s.className = 'tag';
  applyTag(s, p);
  return s;
}
function applyTag(el, p){
  setText(el, p);
  setStyle(el, 'background', `${posColor(p)}22`);
  setStyle(el, 'color', posColor(p));
}

const HERO_STATS = ['proj','adp','vor','val','up','back'];
let heroNodes = null;

function buildHero(){
  const meta = $('h-meta'); meta.textContent = '';
  const tagEl = makeTag('RB'); const metaTxt = document.createElement('span');
  meta.append(tagEl, metaTxt);

  const wrap = $('h-stats'); wrap.textContent = '';
  const vals = {};
  HERO_STATS.forEach(label => {
    const d = document.createElement('div'); d.className = 'stat';
    const l = document.createElement('div'); l.className = 'l'; l.textContent = label;
    const v = document.createElement('div'); v.className = 'v';
    d.append(l, v); wrap.appendChild(d); vals[label] = v;
  });
  heroNodes = {tagEl, metaTxt, vals};
}

function renderHero(recs){
  if (!heroNodes) buildHero();
  const n = heroNodes;
  if (!recs.length){
    setText($('h-name'), '—'); setText(n.metaTxt, ''); setText($('h-note'), '');
    setText($('h-sim'), '—'); setText($('h-gap'), '');
    HERO_STATS.forEach(k => setText(n.vals[k], '—'));
    return;
  }
  const r = recs[0];
  setText($('h-name'), r.name);
  applyTag(n.tagEl, r.position);
  setText(n.metaTxt, `${r.team} · bye ${r.bye ?? '—'}`);
  setText($('h-note'), r.note || '');

  if (r.sim != null){
    tween($('h-sim'), r.sim); prevSim = r.sim;
    const gap = recs[1] && recs[1].sim != null ? (r.sim - recs[1].sim) : null;
    setText($('h-gap'), gap === null ? '' : gap > 1.5 ? `+${gap.toFixed(1)} over next` : `near tie · +${gap.toFixed(1)}`);
  } else { setText($('h-sim'), '—'); setText($('h-gap'), ''); }

  const vals = {proj:r.projection.toFixed(1), adp:r.adp.toFixed(1), vor:r.vor.toFixed(0),
                val:r.val.toFixed(0), up:r.upside.toFixed(0), back:(r.survive*100).toFixed(0)+'%'};
  HERO_STATS.forEach(k => setText(n.vals[k], vals[k]));
  setStyle(n.vals.back, 'color', survColor(r.survive));
  setStyle(n.vals.up, 'color', r.upside >= 10 ? 'var(--good)' : '');
}

function buildRow(r){
  const tr = document.createElement('tr');
  tr.dataset.pid = r.pid;
  // Strip the entrance animation once it has played -- if the class lingers,
  // any later re-insertion replays it. The timer is a backstop: animations do
  // not run at all in a backgrounded tab, so animationend may never fire, and
  // a row must never be left wearing an animation class.
  const done = () => tr.classList.remove('enter');
  tr.addEventListener('animationend', done, {once: true});
  setTimeout(done, 700);
  tr.classList.add('enter');
  const mk = (cls) => { const td = document.createElement('td'); if (cls) td.className = cls; tr.appendChild(td); return td; };

  const rank = mk('rank');
  const who = mk('l');
  const tagEl = makeTag(r.position);
  const name = document.createElement('span'); name.className = 'pname';
  const sm = document.createElement('span'); sm.className = 'sm';
  who.append(tagEl, name, sm);

  const adp = mk(), proj = mk(), vor = mk(), val = mk();
  const up = mk(); const upSpan = document.createElement('span'); up.appendChild(upSpan);
  const back = mk(); const backSpan = document.createElement('span');
  backSpan.style.fontWeight = '600'; back.appendChild(backSpan);
  const sim = mk(), note = mk('notes');

  tr._ = {rank, tagEl, name, sm, adp, proj, vor, val, upSpan, backSpan, sim, note};
  return tr;
}

function fillRow(tr, r, i){
  const n = tr._;
  setText(n.rank, i + 1);
  applyTag(n.tagEl, r.position);
  setText(n.name, r.name);
  setText(n.sm, `${r.team}${r.bye ? ' · ' + r.bye : ''}`);
  setText(n.adp, r.adp.toFixed(1));
  setText(n.proj, r.projection.toFixed(1));
  setText(n.vor, r.vor.toFixed(0));
  setText(n.val, r.val.toFixed(0));

  setText(n.upSpan, r.upside.toFixed(0));
  const boom = r.upside >= 10;
  setClass(n.upSpan, 'chip', boom);
  setStyle(n.upSpan, 'background', boom ? 'var(--good-soft)' : '');
  setStyle(n.upSpan, 'color', boom ? 'var(--good)' : 'var(--text-3)');

  setText(n.backSpan, (r.survive * 100).toFixed(0) + '%');
  setStyle(n.backSpan, 'color', survColor(r.survive));

  const next = r.sim == null ? '—' : r.sim.toFixed(1);
  if (n.sim.textContent && n.sim.textContent !== next) playOnce(n.sim, 'flash');
  setText(n.sim, next);
  setText(n.note, r.note || '');
  setClass(tr, 'top', i === 0);
}

function renderBoard(recs, done){
  const body = $('board');
  const empty = $('board-empty');
  empty.style.display = recs.length ? 'none' : 'block';
  empty.textContent = done ? 'draft complete' : 'waiting for the draft to start';

  const before = new Map();
  rows.forEach((el, pid) => before.set(pid, el.getBoundingClientRect().top));

  const seen = new Set();
  recs.forEach((r, i) => {
    let tr = rows.get(r.pid);
    if (!tr){ tr = buildRow(r); rows.set(r.pid, tr); }
    fillRow(tr, r, i);
    place(body, tr, i);
    seen.add(r.pid);
  });
  rows.forEach((el, pid) => { if (!seen.has(pid)){ el.remove(); rows.delete(pid); } });

  // FLIP: rows glide to their new rank instead of snapping.
  rows.forEach((el, pid) => {
    const was = before.get(pid);
    if (was === undefined) return;
    const dy = was - el.getBoundingClientRect().top;
    if (!dy) return;
    el.style.transition = 'none';
    el.style.transform = `translateY(${dy}px)`;
    requestAnimationFrame(() => {
      el.style.transition = 'transform .45s var(--ease)';
      el.style.transform = '';
    });
  });
}

function renderWaiting(out){
  const max = Math.max(1, ...out.map(o => o.cost));
  const host = $('waiting'), seen = new Set();
  out.slice(0, 6).forEach((o, i) => {
    let b = bars.get(o.position);
    if (!b){
      const row = document.createElement('div'); row.className = 'row';
      const p = document.createElement('div'); p.className = 'p';
      const track = document.createElement('div'); track.className = 'track';
      const fill = document.createElement('div'); fill.className = 'fill';
      const num = document.createElement('div'); num.className = 'n';
      track.appendChild(fill); row.append(p, track, num);
      b = {row, p, fill, num}; bars.set(o.position, b);
    }
    place(host, b.row, i);
    setText(b.p, o.position); setStyle(b.p, 'color', posColor(o.position));
    // Width is only ever assigned when it changes, so the CSS transition
    // actually gets to run instead of being reset every second.
    setStyle(b.fill, 'width', Math.max(2, (o.cost / max) * 100).toFixed(1) + '%');
    setStyle(b.fill, 'background', costColor(o.cost));
    setText(b.num, o.cost.toFixed(0));
    seen.add(o.position);
  });
  bars.forEach((b, pos) => { if (!seen.has(pos)){ b.row.remove(); bars.delete(pos); } });
}

function renderRoster(ro){
  setText($('r-count'), `${ro.size}/${ro.capacity}`);

  const host = $('lineup'), seen = new Set();
  ro.lineup.forEach((p, i) => {
    const key = `${p.slot}:${p.pid}`;
    let s = slots.get(key);
    if (!s){
      const row = document.createElement('div'); row.className = 'slot';
      const lbl = document.createElement('div'); lbl.className = 's';
      const who = document.createElement('div'); who.className = 'p';
      const nm = document.createElement('span');
      const bye = document.createElement('span'); bye.className = 'sm';
      who.append(nm, bye); row.append(lbl, who);
      s = {row, lbl, nm, bye}; slots.set(key, s);
    }
    place(host, s.row, i);
    setText(s.lbl, p.slot); setStyle(s.lbl, 'color', posColor(p.position));
    setText(s.nm, p.name); setText(s.bye, p.bye ?? '—');
    seen.add(key);
  });
  slots.forEach((s, k) => { if (!seen.has(k)){ s.row.remove(); slots.delete(k); } });

  let bn = slots.get('__bench__');
  if (!bn){
    const row = document.createElement('div'); row.className = 'slot'; row.style.marginTop = '6px';
    const lbl = document.createElement('div'); lbl.className = 's'; lbl.textContent = 'BN';
    const who = document.createElement('div'); who.className = 'p';
    who.style.color = 'var(--text-3)'; who.style.whiteSpace = 'normal';
    row.append(lbl, who); bn = {row, who}; slots.set('__bench__', bn);
  }
  if (ro.bench.length){
    place(host, bn.row, ro.lineup.length);
    setText(bn.who, ro.bench.map(b => b.name).join(', '));
  } else bn.row.remove();

  const dhost = $('depth'), dseen = new Set();
  ro.depth.forEach((d, i) => {
    let pill = pills.get(d.position);
    if (!pill){ pill = document.createElement('span'); pill.className = 'pill'; pills.set(d.position, pill); }
    place(dhost, pill, i);
    const ok = d.have >= d.want;
    setText(pill, `${d.position} ${d.have}/${d.want}`);
    setStyle(pill, 'background', ok ? 'var(--good-soft)' : 'var(--bad-soft)');
    setStyle(pill, 'color', ok ? 'var(--good)' : 'var(--bad)');
    dseen.add(d.position);
  });
  pills.forEach((el, pos) => { if (!dseen.has(pos)){ el.remove(); pills.delete(pos); } });

  const bits = [`projected starters ${ro.points}`];
  const needs = Object.entries(ro.needs).map(([k, v]) => `${k}×${v}`).join(', ');
  bits.push(needs ? `still needed ${needs}` : 'starters filled');
  const bc = Object.entries(ro.bye_conflicts).map(([w, n]) => `wk${w}: ${n}`).join(', ');
  if (bc) bits.push(`bye conflicts ${bc}`);
  setText($('r-foot'), bits.join('  ·  '));
  setStyle($('r-foot'), 'color', bc ? 'var(--bad)' : '');
}

function render(d){
  if (!d.ready){ $('sub').textContent = 'waiting for draft data…'; return; }
  $('pick').textContent = `Pick ${d.current_pick} · Round ${d.round}`;
  $('sub').textContent = `${d.teams}-team ${d.scoring} · slot ${d.my_slot ?? '?'} · ${d.status}`;

  const done = d.current_pick > d.total_picks || !d.next_picks.length;
  const c = $('clock');
  if (done){ c.className = 'badge idle'; c.textContent = 'draft complete'; }
  else if (d.on_the_clock){ c.className = 'badge clock'; c.textContent = 'on the clock'; }
  else if (d.my_slot){ c.className = 'badge wait'; c.textContent = `${d.picks_until_mine} until your pick`; }
  else { c.className = 'badge idle'; c.textContent = 'slot unknown'; }

  renderHero(d.recommendations);
  renderBoard(d.recommendations, done);
  renderWaiting(d.outlook);
  renderRoster(d.roster);
  setText($('recent'), d.recent.map(p => `${p.pick}. ${p.name}`).join(' · ') || '—');
}

async function tick(){
  try{
    const r = await fetch('/state.json', {cache:'no-store'});
    const d = await r.json();
    render(d);
    fails = 0;
    setClass($('dot'), 'off', false);
    setText($('conn'), d.computing ? 'thinking…' : 'live');
  }catch(e){
    if (++fails > 1){ setClass($('dot'), 'off', true); setText($('conn'), 'reconnecting'); }
  }
}
tick(); setInterval(tick, 500);
</script>
</body>
</html>
