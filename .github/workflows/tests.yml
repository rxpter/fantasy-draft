name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The engine has no third-party dependencies, and the test suite makes
        # no network calls, so this matrix is the real source of truth for the
        # supported Python floor.
        python-version: ["3.9", "3.11", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Confirm there is nothing to install
        run: python -c "import sys; print(sys.version)"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Byte-compile everything
        run: python -m compileall -q src draft.py tests
